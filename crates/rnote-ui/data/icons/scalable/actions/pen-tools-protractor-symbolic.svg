<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   width="16px"
   height="16px"
   viewBox="0 0 16 16"
   version="1.1">
  <g fill="#222222">
    <!-- Half circle outline with the base line at the bottom -->
    <path fill-rule="evenodd"
          d="M0.5 13 A7.5 7.5 0 0 1 15.5 13 Z M1.2 12.3 A6.8 6.8 0 0 1 14.8 12.3 Z"/>
    <!-- Degree scale -->
    <path d="M4 12.3 A4 4 0 0 1 12 12.3 H11.3 A3.3 3.3 0 0 0 4.7 12.3 Z"/>
    <!-- An arm, turned to 60 degrees -->
    <path d="M7.57 12.05 L12.07 4.25 L12.93 4.75 L8.43 12.55 Z"/>
    <!-- Its handle -->
    <circle cx="12.5" cy="4.5" r="1.5"/>
  </g>
</svg>
